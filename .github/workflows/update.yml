name: Refresh public IBKR portfolio
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/update.yml'
      - 'requirements.txt'
  schedule:
    - cron: '23 7 * * *' # 07:23 UTC daily; IBKR activity statements, not intraday prices
  workflow_dispatch:
permissions:
  contents: write # Persist sanitized historical holdings after each daily run
  pages: write
  id-token: write
concurrency:
  group: ibkr-portfolio-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Test historical accounting and import logic
        run: python -m pytest -q
      - name: Check interactive chart JavaScript syntax
        run: |
          node --check public/chart.js
          node --check public/app.js
          node --check public/returns.js
      - name: Download report, merge snapshot and convert USD to EUR
        if: github.event_name != 'push'
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: python -m src.refresh --sync --backfill-weeks 6
      - name: Backfill dated history to 2024-11-04 on code updates (skips when already done)
        if: github.event_name == 'push'
        env:
          IBKR_FLEX_TOKEN: ${{ secrets.IBKR_FLEX_TOKEN }}
          IBKR_FLEX_QUERY_ID: ${{ secrets.IBKR_FLEX_QUERY_ID }}
        run: python -m src.refresh --inception 2024-11-04
      - name: Persist sanitized historical values for next run
        run: |
          git config user.name 'portfolio-updater[bot]'
          git config user.email 'portfolio-updater@users.noreply.github.com'
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update portfolio snapshots'
            git push origin HEAD:${{ github.event.repository.default_branch }}
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
